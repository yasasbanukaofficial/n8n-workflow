
services:
  n8n:
    image: n8nio/n8n:stable
    restart: unless-stopped

    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HOST: ${HOST_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      NODE_ENV: production
      N8N_WEBHOOK_URL: https://${HOST_DOMAIN}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

    networks:
      - proxy

volumes:
  n8n_data:

networks:
  proxy:
    external: true
    name: proxy
